[project]
name = "sead-clearinghouse-import"
version = "0.1.0"
description = "SEAD Clearing House Import System"
authors = [{name = "Roger Mähler", email = "roger.mahler@hotmail.com"}]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "click>=8.3.0",
    "jinja2>=3.1.6",
    "loguru>=0.7.3",
    "lxml>=4.9.4",
    "numpy>=1.26.2",
    "openpyxl>=3.1.2",
    "pandas>=2.3.3",
    "psycopg>=3.2.13",
    "pyaml>=25.7.0",
    "python-dotenv>=1.0.0",
    "sqlalchemy>=2.0.44",
    "xlrd>=2.0.1",
    "xlsx2csv>=0.8.4",
    "xlsxwriter>=3.1.9",
]

[project.optional-dependencies]
dev = [
    "pylint>=3.0.3",
    "pytest>=7.4.3",
    "pytest-cov>=4.1.0",
    "black>=24.10.0",
    "isort>=5.13.0",    
    "vulture>=2.14",
]
all = [
    "sead-clearinghouse-import[dev]",
]
[project.scripts]
process-submission = "importer.scripts.process_submission:import_file"
import-excel = "importer.scripts.process_submission:import_file"

[tool.pylint.format]
max-line-length = 120

[tool.ruff]
# Ruff = linter + (optional) formatter
target-version = "py313"
line-length = 140
output-format = "concise"

[tool.ruff.lint]
# Import checking rules
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # Pyflakes
    "I",  # isort
    "TID", # flake8-tidy-imports
]
exclude = [
    "__init__.py",
]

[tool.ruff.lint.flake8-tidy-imports]
# Prevent relative imports beyond current package
ban-relative-imports = "parents"

[tool.ruff.lint.pep8-naming]
classmethod-decorators = ["classmethod"]

[tool.ruff.format]
# Use Ruff's formatter (Black-compatible). Set to false if you prefer Black.
quote-style = "double"
indent-style = "space"
docstring-code-format = true


[tool.pylint."MESSAGES CONTROL"]
disable = [
    "C0114",  # missing-module-docstring
    "C0115",  # missing-class-docstring
    "C0116",  # missing-function-docstring
    "R0904",
    "R0903",
    "R0801",
    "too-many-return-statements",
    "too-many-branches",
    "too-many-statements",
    "too-many-lines",
    "too-many-arguments",
    "too-few-public-methods",
    "too-many-nested-blocks",
    "too-many-instance-attributes",
    "too-many-positional-arguments",
    "global-variable-not-assigned",
    "logging-fstring-interpolation",
    "too-many-function-args",
    "too-many-locals",
    "protected-access",
    "f-string-without-interpolation"
]

[tool.black]
line-length = 120
target-version = ["py313"]
skip-magic-trailing-comma = false
exclude = '''
(
  \.git
  | \.pypy_cache
  | \.pytest_cache
  | \.mypy_cache
  | deprecated
  | .venv
)
'''

[tool.isort]
line_length = 120
profile = "black"
py_version = "auto"
float_to_top = true
src_paths = ["importer", "tests"]


# --------------------
# mypy (type checking)
# --------------------
[tool.mypy]
python_version = "3.13"
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
no_implicit_optional = true
strict_equality = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
check_untyped_defs = true
show_error_codes = true
pretty = true

# Loosen types in tests
[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
warn_return_any = false

# --------------------
# pytest
# --------------------
[tool.pytest.ini_options]
addopts = "-q -ra --strict-markers"
testpaths = ["tests"]
python_classes = "Test*"
python_functions = "test_*"
asyncio_mode = "auto"
markers = [
  "integration: marks tests that hit external services (e.g., Ollama, DB)",
  "debug: marks tests for debugging purposes (typically run manually)",
  "manual: marks tests requiring manual setup (e.g., real database)",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["importer"]
